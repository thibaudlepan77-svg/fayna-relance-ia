<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAYNA — démonstration publique</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=demo.html">
<link rel="canonical" href="demo.html">
<style>
  :root { --encre:#0f172a; --sable:#f8fafc; --vert:#0f766e; }
  html,body { margin:0; padding:0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--sable); color: var(--encre);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; box-sizing: border-box; line-height: 1.6;
  }
  .carte { max-width: 34rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { margin: 0 0 1.5rem; font-size: 1.0625rem; }
  a.bouton {
    display: inline-block; background: var(--vert); color: #fff;
    text-decoration: none; font-weight: 600; font-size: 1.0625rem;
    padding: 0.9rem 1.75rem; border-radius: 0.5rem;
    min-height: 44px; box-sizing: border-box;
  }
  a.bouton:hover, a.bouton:focus { background: #115e59; }
</style>
</head>
<body>
  <main class="carte">
    <h1>FAYNA — démonstration publique</h1>
    <p>La démonstration a été déplacée à une adresse stable. Vous y êtes redirigé automatiquement.</p>
    <p><a class="bouton" href="demo.html">Ouvrir la démonstration</a></p>
  </main>
</body>
</html>
